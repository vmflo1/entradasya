# EntradasYa v1 - Sitio de Nginx para el servidor Ubuntu.
# Copiar a /etc/nginx/sites-available/entradasya y activar:
#   sudo ln -s /etc/nginx/sites-available/entradasya /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# payments (8004) y notifications (8006) NO se exponen.

server {
    listen 80;
    server_name _;

    client_max_body_size 5m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;

    location ^~ /api/events/reservas         { return 403; }
    location ^~ /api/tickets/entradas/generar { return 403; }

    location /api/auth/    { proxy_pass http://127.0.0.1:8001/; }
    location /api/events/  { proxy_pass http://127.0.0.1:8002/; }
    location /api/orders/  { proxy_pass http://127.0.0.1:8003/; }
    location /api/tickets/ { proxy_pass http://127.0.0.1:8005/; }
    location /api/checkin/ { proxy_pass http://127.0.0.1:8007/; }

    location / { proxy_pass http://127.0.0.1:8000; }
}
