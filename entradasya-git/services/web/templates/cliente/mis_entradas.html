{% extends "layouts/base.html" %}
{% block title %}Mis entradas · {{ app_name }}{% endblock %}
{% block content %}
<section class="hero hero--small">
  <p class="eyebrow">Tu cuenta</p>
  <h1 class="hero__title">Mis <em class="tilt">entradas</em></h1>
</section>

<section aria-labelledby="t-entradas">
  <h2 id="t-entradas" class="section-title">Entradas</h2>
  <div class="tickets" id="tickets"><p class="muted">Cargando…</p></div>
</section>

<section aria-labelledby="t-compras" class="block-gap">
  <h2 id="t-compras" class="section-title">Mis compras</h2>
  <div class="card table-wrap">
    <table class="table">
      <thead><tr><th>Fecha</th><th>Evento</th><th>Sector</th><th>Entradas</th><th>Total</th><th>Estado</th></tr></thead>
      <tbody id="orders"><tr><td colspan="6" class="muted">Cargando…</td></tr></tbody>
    </table>
  </div>
</section>
{% endblock %}
{% block scripts %}<script src="/static/js/mis_entradas.js?v={{ v }}"></script>{% endblock %}
