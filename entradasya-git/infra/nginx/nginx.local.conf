# EntradasYa v1 - Nginx para ejecutar en local (Windows o Linux).
# Única puerta de entrada: http://localhost:8080
# payments (8004) y notifications (8006) NO se exponen.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 5m;

    server {
        listen 8080;
        server_name localhost;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # Rutas internas: solo orders puede usarlas (directo, sin pasar por Nginx)
        location ^~ /api/events/reservas         { return 403; }
        location ^~ /api/tickets/entradas/generar { return 403; }

        location /api/auth/    { proxy_pass http://127.0.0.1:8001/; }
        location /api/events/  { proxy_pass http://127.0.0.1:8002/; }
        location /api/orders/  { proxy_pass http://127.0.0.1:8003/; }
        location /api/tickets/ { proxy_pass http://127.0.0.1:8005/; }
        location /api/checkin/ { proxy_pass http://127.0.0.1:8007/; }

        # Todo lo demás es la aplicación web
        location / { proxy_pass http://127.0.0.1:8000; }
    }
}
