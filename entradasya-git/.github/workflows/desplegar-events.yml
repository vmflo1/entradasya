# Pipeline del servicio events: cada push a main que cambie services/events/ lo verifica y lo despliega.
name: Desplegar events

on:
  push:
    branches: [main]
    paths:
      - "services/events/**"
  workflow_dispatch:   # también se puede lanzar a mano desde la pestaña Actions

concurrency:
  group: desplegar-events
  cancel-in-progress: false

jobs:
  events:
    uses: ./.github/workflows/_desplegar.yml
    with:
      servicio: events
    secrets: inherit
